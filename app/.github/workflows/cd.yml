# ============================================================================
# CD Pipeline — Lumina Application
# ============================================================================
# Se activa al crear un release tag (v*.*.*).
# Construye imagen Docker, la publica en GHCR, y despliega a staging/production.
# ============================================================================

name: 🚀 CD Pipeline

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ──────────────────────────────────────────────
  # 1. Run CI First
  # ──────────────────────────────────────────────
  ci:
    name: 🔄 Run CI Checks
    uses: ./.github/workflows/ci.yml

  # ──────────────────────────────────────────────
  # 2. Build & Publish Docker Image
  # ──────────────────────────────────────────────
  build-and-push:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ci
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SHA fijado)

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3 (SHA fijado)

      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3 (SHA fijado)
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5 (SHA fijado)
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🏗️ Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6 (SHA fijado)
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: 📋 Image summary
        run: |
          echo "## 🐳 Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | \`${{ steps.meta.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Digest** | \`${{ steps.build.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────
  # 3. Deploy to Staging
  # ──────────────────────────────────────────────
  deploy-staging:
    name: 🟡 Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-push
    environment:
      name: staging
      url: https://staging.lumina.example.com

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SHA fijado)

      - name: 🚀 Deploy to staging
        run: |
          echo "🟡 Deploying to staging environment..."
          echo ""
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image-tag }}"
          echo "Digest: ${{ needs.build-and-push.outputs.image-digest }}"
          echo ""
          # ─────────────────────────────────────────────────────────
          # Aquí va tu lógica de deploy real. Ejemplos:
          #
          # SSH Deploy:
          #   ssh ${{ secrets.STAGING_HOST }} "docker pull ... && docker-compose up -d"
          #
          # Kubernetes:
          #   kubectl set image deployment/lumina app=$IMAGE:$TAG
          #
          # Cloud Run:
          #   gcloud run deploy lumina-staging --image=$IMAGE:$TAG
          #
          # Railway / Render / Fly.io:
          #   flyctl deploy --image $IMAGE:$TAG
          # ─────────────────────────────────────────────────────────
          echo "✅ Staging deployment completed!"

      - name: 🏥 Health check
        run: |
          echo "🏥 Running health check on staging..."
          # curl -f https://staging.lumina.example.com/health || exit 1
          echo "✅ Staging is healthy!"

  # ──────────────────────────────────────────────
  # 4. Deploy to Production (Manual Approval)
  # ──────────────────────────────────────────────
  deploy-production:
    name: 🟢 Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-and-push, deploy-staging]
    environment:
      name: production
      url: https://lumina.example.com

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SHA fijado)

      - name: 🚀 Deploy to production
        run: |
          echo "🟢 Deploying to production environment..."
          echo ""
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image-tag }}"
          echo ""
          # ─────────────────────────────────────────────────────────
          # Misma lógica de deploy que staging, apuntando a prod.
          # ─────────────────────────────────────────────────────────
          echo "✅ Production deployment completed!"

      - name: 🏥 Health check
        run: |
          echo "🏥 Running health check on production..."
          # curl -f https://lumina.example.com/health || exit 1
          echo "✅ Production is healthy!"

      - name: 📋 Release summary
        run: |
          echo "## 🚀 Production Release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`${{ needs.build-and-push.outputs.image-tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | Production |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployed by** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
