# ============================================================================
# CodeQL Analysis — Lumina Application
# ============================================================================
# Análisis estático de seguridad con GitHub CodeQL.
# Se ejecuta semanalmente y en cada PR a main.
# ============================================================================

name: 🛡️ CodeQL Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 6 * * 1" # Todos los lunes a las 06:30 UTC

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: 🔬 Analyze JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SHA fijado)

      - name: 🛡️ Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3 (SHA fijado)
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: 🔬 Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3 (SHA fijado)
        with:
          category: "/language:${{ matrix.language }}"
